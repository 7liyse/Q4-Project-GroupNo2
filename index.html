<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Westerburg High Campus Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; height: 100vh; display: flex; align-items: center; }
        .login-card { 
            max-width: 400px; width: 100%; padding: 40px; 
            border-radius: 30px; background: white; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }
        .form-control { border-radius: 20px; background: #d1d5db; border: none; text-align: center; }
        .btn-login { border-radius: 20px; background-color: #00cae3; border: none; padding: 10px 30px; color: white; }
        .btn-login:disabled { background-color: #9ca3af; cursor: not-allowed; }
        .label-badge { background: #B7313A; color: white; border-radius: 10px; padding: 2px 10px; font-size: 12px; margin-bottom: -10px; z-index: 1; position: relative; }
        #timer { color: #dc3545; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="login-card text-center">
        <img src="https://upload.wikimedia.org/wikipedia/commons/f/fb/Heathers-_The_Musical_logo.png" alt="Logo" class="sidebar-logo" style="width: 80px;">
        <h1 class="fw-bold mb-4">Student Login Page</h1>

        <div class="mb-4 d-flex flex-column align-items-center">
            <span class="label-badge">Username:</span>
            <input type="text" id="username" class="form-control mt-1" placeholder="Type Here...">
        </div>

        <div class="mb-4 d-flex flex-column align-items-center">
            <span class="label-badge">Email Address:</span>
            <input type="email" id="email" class="form-control mt-1" placeholder="email@example.com">
        </div>

        <div class="mb-4 d-flex flex-column align-items-center">
            <span class="label-badge">Password:</span>
            <input type="password" id="password" class="form-control mt-1" placeholder="********">
        </div>

        <div class="form-check form-switch text-start mb-4">
            <input class="form-check-input" type="checkbox" id="stayLogged">
            <label class="form-check-label" for="stayLogged">Stay logged in</label>
        </div>

        <div id="cooldown-area" class="mb-3" style="display: none;">
            <p id="timer">Cooldown Timer: Please wait for 60 seconds.</p>
        </div>

        <div class="d-flex justify-content-center gap-3">
            <button id="loginBtn" class="btn btn-login" onclick="validateLogin()">Login</button>
            <button class="btn btn-link text-dark text-decoration-none" onclick="window.location.reload()">Cancel</button>
        </div>
    </div>
</div>

<script>
    
    const validUser = "Veronica Sawyer";
    const validPass = "12345678";
    const validEmail = "sawyer.v@imaginaryschool.edu.ph";

    
    let attempts = 0;
    const maxAttempts = 3;

    function validateLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const email = document.getElementById('email').value;
        const loginBtn = document.getElementById('loginBtn');
        const cooldownArea = document.getElementById('cooldown-area');
        const timerText = document.getElementById('timer');

        
        if (user === validUser && pass === validPass && email === validEmail) {
            alert("Login Successful!");
            window.location.href = "dashboard.html";
            return;
        }

        
        attempts++;
        
        if (attempts >= maxAttempts) {
            alert("ERROR: Threat Detected. Too Many Failed Attempts. You have been temporarily locked out for a cooldown of 1 Minute. If you wish to continue, please put in the right credentials once the timer ends.");
            startCooldown(loginBtn, cooldownArea, timerText);
        } else {
            alert(`ERROR: Invalid Credential Detected. You only have ${maxAttempts - attempts} attempts left. Please put in the right credentials (Username/Email Adrdress/Password) if you wish to continue.`);
        }
    }

    function startCooldown(btn, area, text) {
        btn.disabled = true;
        area.style.display = "block";
        attempts = 0; 
        
        let secondsLeft = 60;
        
        const countdown = setInterval(() => {
            secondsLeft--;
            text.innerText = `Please wait: ${secondsLeft}s`;
            
            if (secondsLeft <= 0) {
                clearInterval(countdown);
                btn.disabled = false;
                area.style.display = "none";
                text.innerText = "Please wait: 60s";
            }
        }, 1000);
    }
</script>

</body>
</html>
